# Выпуск версии. Два способа:
# 1) поменять __version__ в avtootchet/__init__.py и влить в main (в том числе через
#    Pull Request) - если релиза с этой версией ещё нет, он соберётся сам;
#    «Что нового» берётся из описания коммита (для Pull Request - из его заголовка);
# 2) по-старому: release.bat 0.3.0 "Что нового" (тег v0.3.0).
# Сборка, тест, подпись и публикация - здесь.
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"            # русский текст в выводе; без этого Python на Windows падает
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Версия и описание
        id: ver
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git tag -l --format='%(contents)' "${TAG}" > notes.txt
          else
            VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' avtootchet/__init__.py)
            TAG="v${VER}"
            if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "Релиз ${TAG} уже есть - версия не менялась, собирать нечего."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # описание = текст коммита без служебных строк
            # grep без совпадений возвращает 1 - при pipefail это уронило бы шаг
            git log -1 --format=%B | { grep -v -E '^(Co-Authored-By:|Claude-Session:|Signed-off-by:|Merge pull request)' || true; } > notes.txt
          fi
          if ! grep -q '[^[:space:]]' notes.txt; then
            echo "ACMineevo ${TAG}" > notes.txt     # описание пустое - хоть что-то для окна обновления
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Версия ${TAG}"; cat notes.txt

      - uses: actions/setup-python@v6
        if: steps.ver.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Зависимости
        if: steps.ver.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Версия в программе
        if: steps.ver.outputs.skip != 'true'
        run: python tools/set_version.py ${{ steps.ver.outputs.tag }}

      - name: Проверка
        if: steps.ver.outputs.skip != 'true'
        env:
          QT_QPA_PLATFORM: offscreen
          AVTO_NO_OPEN: "1"
        run: python tests/updater_check.py && python tests/comdate_check.py && python tests/probe_check.py && python tests/revenue_check.py && python tests/layout_check.py && python tests/stock_probe_check.py && python tests/stock_check.py && python tests/process_probe_check.py && python tests/process_check.py && python tests/crm_probe_check.py && python tests/marketing_check.py && python tests/marketing_export_check.py && python tests/com_release_check.py && python tests/vitrina_check.py && python tests/e2e_check.py

      - name: Сборка
        if: steps.ver.outputs.skip != 'true'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name ACMineevo-Vladelec --hidden-import win32timezone --add-data "demo\export.json;demo" owner_main.py
          pyinstaller --noconfirm --clean --onefile --windowed --name ACMineevo-Buhgalter accountant_main.py
          pyinstaller --noconfirm --clean --onefile --windowed --name ACMineevo-Marketing --hidden-import win32timezone marketing_main.py
          pyinstaller --noconfirm --clean --onefile --windowed --name ACMineevo-Vitrina --hidden-import win32timezone --add-data "avtootchet\vitrina\web;avtootchet\vitrina\web" vitrina_main.py

      - name: Подпись
        if: steps.ver.outputs.skip != 'true'
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        # копии со старыми именами - для программ до 0.9.0: они ищут в релизе файл со своим именем
        # (подпись привязана к имени файла, поэтому подписываются обе копии)
        run: |
          copy dist\ACMineevo-Vladelec.exe dist\AvtoOtchet-Vladelec.exe
          copy dist\ACMineevo-Buhgalter.exe dist\AvtoOtchet-Buhgalter.exe
          copy dist\ACMineevo-Marketing.exe dist\AvtoOtchet-Marketing.exe
          python tools/sign_release.py ${{ steps.ver.outputs.tag }} dist/ACMineevo-Vladelec.exe dist/ACMineevo-Buhgalter.exe dist/ACMineevo-Marketing.exe dist/ACMineevo-Vitrina.exe dist/AvtoOtchet-Vladelec.exe dist/AvtoOtchet-Buhgalter.exe dist/AvtoOtchet-Marketing.exe

      - name: Публикация
        if: steps.ver.outputs.skip != 'true'
        shell: bash
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" --target "${GITHUB_SHA}" \
            --title "ACMineevo ${{ steps.ver.outputs.tag }}" --notes-file notes.txt \
            dist/ACMineevo-Vladelec.exe dist/ACMineevo-Vladelec.exe.sig \
            dist/ACMineevo-Buhgalter.exe dist/ACMineevo-Buhgalter.exe.sig \
            dist/ACMineevo-Marketing.exe dist/ACMineevo-Marketing.exe.sig \
            dist/ACMineevo-Vitrina.exe dist/ACMineevo-Vitrina.exe.sig \
            dist/AvtoOtchet-Vladelec.exe dist/AvtoOtchet-Vladelec.exe.sig \
            dist/AvtoOtchet-Buhgalter.exe dist/AvtoOtchet-Buhgalter.exe.sig \
            dist/AvtoOtchet-Marketing.exe dist/AvtoOtchet-Marketing.exe.sig
