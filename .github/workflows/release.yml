# Новая версия: git tag -a v0.2.0 -m "Что нового" && git push origin v0.2.0
# (или release.bat 0.2.0 "Что нового"). Сборка, тест, подпись и публикация - здесь.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"            # русский текст в выводе; без этого Python на Windows падает
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5

      - name: Описание версии из тега
        shell: bash
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > notes.txt
          cat notes.txt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Версия
        run: python tools/set_version.py ${{ github.ref_name }}

      - name: Проверка
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/updater_check.py && python tests/e2e_check.py

      - name: Сборка
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name AvtoOtchet-Vladelec --add-data "demo\export.json;demo" owner_main.py
          pyinstaller --noconfirm --clean --onefile --windowed --name AvtoOtchet-Buhgalter accountant_main.py

      - name: Подпись
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: python tools/sign_release.py ${{ github.ref_name }} dist/AvtoOtchet-Vladelec.exe dist/AvtoOtchet-Buhgalter.exe

      - name: Публикация
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "АвтоОтчёт ${GITHUB_REF_NAME}" --notes-file notes.txt \
            dist/AvtoOtchet-Vladelec.exe dist/AvtoOtchet-Vladelec.exe.sig \
            dist/AvtoOtchet-Buhgalter.exe dist/AvtoOtchet-Buhgalter.exe.sig
